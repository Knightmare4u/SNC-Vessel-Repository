name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # Lets dorny/test-reporter publish the test results as a check
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same version as docker-compose.yml
        image: postgres:16
        env:
          POSTGRES_DB: snc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway key for tests only; the real one stays in .env
      SECRET_KEY: ci-only-not-a-real-secret
      # DEBUG=False makes settings.py use Postgres, as in production
      DEBUG: 'False'
      DB_NAME: snc
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      # setup-python marks every logged traceback as an error, even ones tests
      # cause on purpose; dorny/test-reporter marks the real failures instead
      - name: Turn off Python traceback annotations
        run: echo "::remove-matcher owner=python::"

      - name: Install dependencies
        # These two are only needed here, so they stay out of requirements.txt
        run: pip install -r requirements.txt coverage==7.17.3 unittest-xml-reporting==4.0.0

      - name: Check for missing migrations
        run: python manage.py makemigrations --check

      - name: Run tests
        id: tests
        # Explicit bash turns on pipefail, so a test failure is not hidden by tee
        shell: bash
        env:
          # Unbuffered, so lines reach test-output.txt in the order they were printed
          PYTHONUNBUFFERED: '1'
        # XMLTestRunner also writes the results as JUnit XML, one TEST-*.xml per test class
        run: >-
          coverage run --source=. manage.py test
          --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner
          2>&1 | tee test-output.txt

      # The report steps also run when tests fail, but not when they never ran
      - name: Publish test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TEST-*.xml
          reporter: python-xunit

      - name: Build coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          coverage html
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            htmlcov/
            test-output.txt
            TEST-*.xml
