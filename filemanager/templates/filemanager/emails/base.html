{# Email layout. Inline styles and tables: many mail clients drop <style> blocks and ignore flexbox/grid. #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SNSeaFiles{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background: #f5f7fa; font-family: 'Segoe UI', Arial, sans-serif; color: #17212b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f5f7fa;">
        <tr>
            <td align="center" style="padding: 24px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px;">
                    <tr>
                        <td style="background: #17253a; color: #ffffff; padding: 18px 24px; font-size: 15px; font-weight: 700; border-radius: 12px 12px 0 0;">
                            SNSeaFiles · Document Signing
                        </td>
                    </tr>
                    <tr>
                        <td style="background: #ffffff; border: 1px solid #dfe4ea; border-top: 0; border-radius: 0 0 12px 12px; padding: 28px 24px; font-size: 14px; line-height: 1.6;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 16px 8px; color: #6b7787; font-size: 12px; text-align: center;">
                            This is an automated message from SNSeaFiles. Please do not reply.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
