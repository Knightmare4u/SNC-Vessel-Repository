{# Table-wrapped link: renders as a button in every mail client, including Outlook #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 24px 0 8px;">
    <tr>
        <td style="background: #2563eb; border-radius: 8px;">
            <a href="{{ url }}" style="display: inline-block; padding: 11px 20px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;">{{ label }}</a>
        </td>
    </tr>
</table>
