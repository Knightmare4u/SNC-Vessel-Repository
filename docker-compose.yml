services:
  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn oakmaritime.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 300
      --capture-output
      --access-logfile logs/access.log
      --access-logformat '%(h)s %(t)s \"%(r)s\" %(s)s %(L)s seconds'
      --error-logfile logs/error.log"
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./vessel_files:/app/vessel_files
      - ./logs:/app/logs
    restart: unless-stopped
