services:
  db:
    image: postgres:16
    container_name: snc-vessel-repository-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: snc-vessel-repository-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    image: snc-vessel-repository-web
    container_name: snc-vessel-repository-web
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn oakmaritime.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class gthread
      --threads 4
      --timeout 600
      --capture-output
      --access-logfile logs/access.log
      --access-logformat '%(p)s %(h)s %(t)s \"%(r)s\" %(s)s %(L)s seconds'
      --error-logfile logs/error.log"
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ${VESSEL_STORAGE_PATH:-./vessel_files}:/app/vessel_files
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
